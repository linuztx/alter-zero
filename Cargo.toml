[package]
name = "inline-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.1"
unicode-width = "0.2"
# Grapheme-cluster segmentation for the codex-style textarea: the cursor moves and
# deletes by grapheme (so emoji-ZWJ sequences / combining marks count as one), and
# wrapping hard-breaks long words on grapheme boundaries.
unicode-segmentation = "1"
# Async runtime for the codex-style event loop (current-thread, minimal feature
# set — no tokio I/O; crossterm's EventStream owns stdin via its own reactor).
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# `StreamExt::next` for crossterm's async `EventStream`.
tokio-stream = "0.1"
# Turns on crossterm's async `EventStream`. We still import crossterm ONLY via
# `ratatui::crossterm` — this entry just enables the feature on the same
# crossterm crate ratatui already uses (cargo feature unification); ratatui does
# not forward `event-stream` itself.
crossterm = { version = "0.29.0", features = ["event-stream"] }
# Local wall-clock timestamps for the Ctrl+O transcript. Used ONLY in main.rs —
# the I/O boundary — so the clock impurity never reaches the pure library; the
# `clock` feature pulls in local-timezone support, default features off to stay
# lean. See docs/timestamps.md.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Ctrl+V image paste (docs/image-paste.md). These three are used ONLY at the I/O
# boundary (src/clipboard.rs) — the pure attach/placeholder logic stays in `app`.
# arboard reads the system clipboard (image bytes or a copied file); on Linux it
# speaks X11 + Wayland (the `wayland-data-control` feature) through pure-Rust
# backends (x11rb / wl-clipboard), so no system C libraries are needed to build.
arboard = { version = "3", features = ["wayland-data-control"] }
# Decode whatever the clipboard holds (PNG/JPEG/GIF/WebP) and re-encode it to one
# consistent PNG on disk. Default features off — only the codecs we accept.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Write the decoded image to a kept temporary PNG the backend reads by path.
tempfile = "3"

# Bake the project's pre-commit gate into every build so it can't silently
# regress (there is no CI yet). Mirrors `clippy --all-targets -- -D warnings`.
[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"
