[package]
name = "alter-zero"
version = "0.1.0"
edition = "2024"
# Two binary targets share the one entry point (`src/main.rs`): the primary
# `alter-zero` and the short alias `alter0`, so `cargo build --release` yields
# both `./target/release/alter-zero` and `./target/release/alter0`. `cargo run`
# would otherwise be ambiguous with multiple bins, so pick the canonical one.
default-run = "alter-zero"

# The full name and the short alias. Both compile `src/main.rs`, so the two
# binaries are byte-for-byte identical in behaviour — invoke whichever you like.
[[bin]]
name = "alter-zero"
path = "src/main.rs"

[[bin]]
name = "alter0"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.1"
unicode-width = "0.2"
# Grapheme-cluster segmentation for the codex-style textarea: the cursor moves and
# deletes by grapheme (so emoji-ZWJ sequences / combining marks count as one), and
# wrapping hard-breaks long words on grapheme boundaries.
unicode-segmentation = "1"
# Async runtime for the codex-style event loop (current-thread, minimal feature
# set — no tokio I/O; crossterm's EventStream owns stdin via its own reactor).
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# `StreamExt::next` for crossterm's async `EventStream`.
tokio-stream = "0.1"
# Turns on crossterm's async `EventStream`. We still import crossterm ONLY via
# `ratatui::crossterm` — this entry just enables the feature on the same
# crossterm crate ratatui already uses (cargo feature unification); ratatui does
# not forward `event-stream` itself.
crossterm = { version = "0.29.0", features = ["event-stream"] }
# Local wall-clock timestamps for the Ctrl+O transcript. Used ONLY in main.rs —
# the I/O boundary — so the clock impurity never reaches the pure library; the
# `clock` feature pulls in local-timezone support, default features off to stay
# lean. See docs/timestamps.md.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Ctrl+V image paste (docs/image-paste.md). These three are used ONLY at the I/O
# boundary (src/clipboard.rs) — the pure attach/placeholder logic stays in `app`.
# arboard reads the system clipboard (image bytes or a copied file); on Linux it
# speaks X11 + Wayland (the `wayland-data-control` feature) through pure-Rust
# backends (x11rb / wl-clipboard), so no system C libraries are needed to build.
arboard = { version = "3", features = ["wayland-data-control"] }
# Decode whatever the clipboard holds (PNG/JPEG/GIF/WebP) and re-encode it to one
# consistent PNG on disk. Default features off — only the codecs we accept.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Write the decoded image to a kept temporary PNG the backend reads by path.
tempfile = "3"
# The /resume session files (docs/resume.md): each conversation is recorded as
# a codex-style JSONL "rollout" file and parsed back on resume. serde/serde_json
# serialize the `session` module's OWN record types (the on-disk format) — the
# app types stay serde-free, and arbitrary user text (quotes, newlines, unicode)
# round-trips without hand-rolled escaping. serde also derives the `llm` module's
# provider config and the wire types for the OpenAI-compatible client.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The real LLM backend (docs/llm.md). Used ONLY at the I/O boundary — the `llm`
# module's HTTP client (src/llm/openai.rs, src/llm/models.rs) and the backend
# bridge (src/llm/backend.rs) — so the pure cores (config parse, the reasoning
# `ThinkingSplitter`, the /v1/models response shape, the `/model` picker state)
# stay reqwest-free and unit-testable.
#
# `blocking` so the backend streams on the same plain OS thread as `DummyAi`
# (the `ReplySource::spawn` seam hands out a `std::thread::JoinHandle`, and a
# blocking `reqwest::Response` is a `std::io::Read` we drain line-by-line for
# SSE while polling the `CancelToken` — no nested tokio runtime). `rustls-tls`
# keeps the build pure-Rust (no system OpenSSL, matching arboard's stance); the
# agent proxy's custom CA is loaded at runtime from `SSL_CERT_FILE`. `json`
# serializes request bodies; default features off to stay lean.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Parse `providers.toml` (docs/llm.md) into the `llm::config` provider table.
toml = "0.8"
# The detached-exec helper mode (src/subprocess.rs): the safe `setsid()`
# wrapper that severs a shell child from the TUI's controlling terminal, so a
# command that prompts on /dev/tty (`sudo`, `ssh`) fails fast instead of
# writing its prompt over the live region and fighting the event loop for the
# keyboard. Used by the helper re-exec tier (the fallback where the `setsid`
# binary is absent — macOS, minimal images). This crate forbids `unsafe` (no
# libc/pre_exec), and rustix is already in the tree via crossterm — `process`
# just enables its setsid wrapper.
rustix = { version = "1", features = ["process"] }
# Real token counting for the status-line tally (`tokenizer` module): the
# `o200k_base` BPE ranks ship embedded in the crate, so counting is offline and
# deterministic — no runtime fetch. See docs/status-indicator.md.
tiktoken-rs = "0.12.0"
# Grammar-accurate syntax highlighting for fenced code blocks (`highlight`
# module, docs/markdown.md) — a port of codex's stack. `two-face` bundles ~250
# TextMate grammars + 32 themes; `syntect` is the highlighting engine. We use the
# **oniguruma** regex engine (`*-onig`), exactly as codex does. This is the ONE
# place the crate takes a C build dependency (`onig_sys` bundles + compiles the
# oniguruma C source, so a C compiler — not a system library — is needed at build
# time): the pure-Rust `fancy-regex` alternative compiles each TextMate grammar
# into MUCH heavier state (measured: 28 languages = 187 MB RSS with fancy vs
# ~23 MB with onig — an 8x reduction), because syntect lazily compiles a grammar's
# regexes on first use and caches them in the shared SyntaxSet. For a coding TUI
# where the model writes code in many languages, fancy's footprint is unacceptable,
# so onig wins here. Used from the pure `highlight` module (process-global
# grammar/theme singletons); the per-line `ParseState`/`HighlightState` are threaded
# incrementally so streaming stays prefix-stable (CLAUDE.md invariant 2).
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
syntect = { version = "5", default-features = false, features = ["default-onig"] }

# Bake the project's pre-commit gate into every build so it can't silently
# regress (there is no CI yet). Mirrors `clippy --all-targets -- -D warnings`.
[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"

# Dependencies are compiled with optimizations even in dev builds: `cargo run`
# must feel like the shipped binary where it counts — the Ctrl+V image paste
# PNG-encodes a screenshot through `image`/`png`/`fdeflate` (~65x slower
# unoptimized: ~1.6s vs ~25ms for 1080p), and ratatui repaints every frame.
# Our own crate keeps opt-level 0 for fast rebuilds and full debug info.
[profile.dev]
# Light optimization for our own crate too: dependency generics (the PNG
# encoder is generic over the writer) monomorphise INTO this crate, so at
# opt-level 0 they run unoptimised no matter how the deps were built.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
