[package]
name = "alter-zero"
version = "0.1.1"
edition = "2024"
authors = ["linuztx <linuztx@gmail.com>"]
description = "An autonomous AI coding agent that lives in your terminal."
license = "Apache-2.0"
repository = "https://github.com/linuztx/alter-zero"

# The one binary target (`src/main.rs`): `cargo build --release` yields
# `./target/release/alter-zero`.
[[bin]]
name = "alter-zero"
path = "src/main.rs"

[dependencies]
# Default features off: `all-widgets` is only the calendar widget, which
# drags the whole `time` family into every build, and `macros` is
# `ratatui-macros`, which nothing here uses (docs/build-time.md). What stays
# is what the code reaches — `crossterm` (the backend and the re-export
# below), `underline-color` (the `Style::underline_color` channel `links` and
# `images` ride as their carrier), `layout-cache` (a default that costs
# nothing).
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
unicode-width = "0.2"
# Grapheme-cluster segmentation for the codex-style textarea: the cursor moves and
# deletes by grapheme (so emoji-ZWJ sequences / combining marks count as one), and
# wrapping hard-breaks long words on grapheme boundaries.
unicode-segmentation = "1"
# Async runtime for the codex-style event loop (current-thread, minimal feature
# set — no tokio I/O; crossterm's EventStream owns stdin via its own reactor).
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# `StreamExt::next` for crossterm's async `EventStream`.
tokio-stream = "0.1"
# Turns on crossterm's async `EventStream`. We still import crossterm ONLY via
# `ratatui::crossterm` — this entry just enables the feature on the same
# crossterm crate ratatui already uses (cargo feature unification); ratatui does
# not forward `event-stream` itself.
crossterm = { version = "0.29.0", features = ["event-stream"] }
# Local wall-clock timestamps for the Ctrl+O transcript. Used ONLY in main.rs —
# the I/O boundary — so the clock impurity never reaches the pure library; the
# `clock` feature pulls in local-timezone support, default features off to stay
# lean. See docs/timestamps.md.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Ctrl+V image paste (docs/image-paste.md). These three are used ONLY at the I/O
# boundary (src/clipboard.rs) — the pure attach/placeholder logic stays in `app`.
# arboard reads the system clipboard (image bytes or a copied file); on Linux it
# speaks X11 + Wayland (the `wayland-data-control` feature) through pure-Rust
# backends (x11rb / wl-clipboard), so no system C libraries are needed to build.
arboard = { version = "3", features = ["wayland-data-control"] }
# Decode whatever the clipboard holds (PNG/JPEG/GIF/WebP) and re-encode it to one
# consistent PNG on disk. Default features off — only the codecs we accept.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Write the decoded image to a kept temporary PNG the backend reads by path.
tempfile = "3"
# The PNG decoder `image` itself sits on, used directly for its row-streaming
# reader (`images::fitted`, docs/memory.md): a picture is shrunk row by row to
# the size it will be shown or sent, so the whole decoded frame — 33 MB for a
# 4K screenshot — is never materialised. Already compiled into every build via
# `image`; declaring it costs nothing new.
png = "0.18"
# The /resume session files (docs/resume.md): each conversation is recorded as
# a codex-style JSONL "rollout" file and parsed back on resume. serde/serde_json
# serialize the `session` module's OWN record types (the on-disk format) — the
# app types stay serde-free, and arbitrary user text (quotes, newlines, unicode)
# round-trips without hand-rolled escaping. serde also derives the `llm` module's
# provider config and the wire types for the OpenAI-compatible client.
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps a parsed object's keys in the order they arrived
# rather than sorting them: a model's tool-call arguments render in the order
# it wrote them (`repoName` before the long `question` it qualifies), which is
# what the MCP cell headers and the permission prompt show (docs/mcp.md).
# `raw_value` lets the `/v1/models` parse borrow each record as an unparsed
# slice of the body instead of materializing the whole catalog as a `Value`
# tree at once — the tree cost ~10x the body in small heap blocks the
# allocator then kept (+6.6 MB RSS per `/model` open on a real 668 KB
# OpenRouter list, measured by examples/mem_probe.rs; docs/llm.md).
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# The real LLM backend (docs/llm.md). Used ONLY at the I/O boundary — the `llm`
# module's HTTP client (src/llm/openai.rs, src/llm/models.rs) and the backend
# bridge (src/llm/backend.rs) — so the pure cores (config parse, the reasoning
# `ThinkingSplitter`, the /v1/models response shape, the `/model` picker state)
# stay reqwest-free and unit-testable.
#
# `blocking` so the backend streams on the same plain OS thread as `DummyAi`
# (the `ReplySource::spawn` seam hands out a `std::thread::JoinHandle`, and a
# blocking `reqwest::Response` is a `std::io::Read` we drain line-by-line for
# SSE while polling the `CancelToken` — no nested tokio runtime). `rustls-tls`
# keeps the build pure-Rust (no system OpenSSL, matching arboard's stance); the
# agent proxy's custom CA is loaded at runtime from `SSL_CERT_FILE`. `json`
# serializes request bodies; default features off to stay lean.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Parse `providers.toml` (docs/llm.md) into the `llm::config` provider table.
# `parse` only: the file is read, never written, so the default `display`
# half — a TOML serializer in `toml` and `toml_edit` — stayed out of the
# build once it was noticed (docs/build-time.md).
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The MCP OAuth flow's PKCE S256 challenge (docs/mcp.md) — used ONLY at the
# I/O boundary (src/llm/mcp/oauth.rs). Both crates are already compiled into
# every build transitively (rustls/ring pull them), so declaring them direct
# costs nothing new.
sha2 = "0.10"
getrandom = "0.3"
# Parse/derive OAuth discovery URLs and the legacy-SSE endpoint resolution at
# the MCP boundary. Already in the tree via reqwest — same zero-cost stance.
url = "2"
# Hook matchers (docs/hooks.md). Both Claude Code and codex take a non-regex
# fast path for `Bash`-style names and compile anything else as a regex; we
# match that contract — warn-and-skipping real regexes would silently break
# any hooks file either reference accepts. Cheap in practice: `regex` is a
# thin wrapper over `regex-automata`, which `fancy-regex` below already pulls
# into every build.
regex = "1"
# The detached-exec helper mode (src/subprocess.rs): the safe `setsid()`
# wrapper that severs a shell child from the TUI's controlling terminal, so a
# command that prompts on /dev/tty (`sudo`, `ssh`) fails fast instead of
# writing its prompt over the live region and fighting the event loop for the
# keyboard. Used by the helper re-exec tier (the fallback where the `setsid`
# binary is absent — macOS, minimal images). This crate forbids `unsafe` (no
# libc/pre_exec), and rustix is already in the tree via crossterm — `process`
# just enables its setsid wrapper.
rustix = { version = "1", features = ["process", "termios"] }
# Real token counting for the status-line tally (`tokenizer` module): the
# o200k_base split pattern's `(?i:…)` groups and `(?!\S)` lookahead need a
# backtracking engine — the same one `tiktoken-rs` uses for it. The vocabulary
# itself ships embedded in the crate (`assets/o200k_base.cbpe`), so counting is
# offline and deterministic — no runtime fetch. The counter is the crate's own
# compact store because `tiktoken-rs`'s `CoreBPE` costs 45.5 MB resident (three
# heap copies of all ~200k tokens + 128 thread-local regex clones) versus ~4 MB
# for the same counts — see docs/tokenizer.md; `tiktoken-rs` remains below as
# the dev-dependency the differential tests prove parity against.
fancy-regex = "0.17"
# Grammar-accurate syntax highlighting for fenced code blocks (`highlight`
# module, docs/markdown.md) — a port of codex's stack. `two-face` bundles ~250
# TextMate grammars + 32 themes; `syntect` is the highlighting engine. We use the
# **oniguruma** regex engine (`*-onig`), exactly as codex does. This is the ONE
# place the crate takes a C build dependency (`onig_sys` bundles + compiles the
# oniguruma C source, so a C compiler — not a system library — is needed at build
# time): the pure-Rust `fancy-regex` alternative compiles each TextMate grammar
# into MUCH heavier state (measured: 28 languages = 187 MB RSS with fancy vs
# ~23 MB with onig — an 8x reduction), because syntect lazily compiles a grammar's
# regexes on first use and caches them in the shared SyntaxSet. For a coding TUI
# where the model writes code in many languages, fancy's footprint is unacceptable,
# so onig wins here. Used from the pure `highlight` module (process-global
# grammar/theme singletons); the per-line `ParseState`/`HighlightState` are threaded
# incrementally so streaming stays prefix-stable (CLAUDE.md invariant 2).
#
# Features are the minimum that loads two-face's prebuilt dumps: syntect's
# `parsing` (which implies `dump-load`, the deserializer those dumps go
# through) + `regex-onig`, and two-face's `syntect-onig`, which selects its
# onig-compiled dump over the fancy-regex one. syntect's `default-onig` also
# carried `plist-load`/`yaml-load`/`html` — the loaders for grammars and
# themes kept as *files* on disk, plus its own bundled dumps — which this
# crate never uses and which cost `plist`, a second `quick-xml`, `yaml-rust`
# and a share of `time` on every build (docs/build-time.md).
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }

# Terminal graphics for the inline image cells (docs/images.md): a pasted
# screenshot and the `read` tool's image reads render as real pixels where the
# terminal can (kitty / iTerm2 / sixel), and as unicode half-blocks everywhere
# else. `default-features = false` drops two things we must not take: the
# `chafa-dyn` feature (a build-time `pkg-config` link against the chafa C
# library — this crate's only other C dependency is syntect's oniguruma, and
# chafa is not installed on a typical box) and `image-defaults` (which would
# turn on every `image` codec; ours are declared above). The `crossterm`
# feature only forwards to `ratatui/crossterm` — already on through ratatui's
# own defaults, named here so it stays on if those ever change. Pinned to the
# 11.x line: it depends on `ratatui ^0.30.1`, the exact version this crate
# uses, so the `Buffer`/`Cell` types are the same ones.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }

# Linux only: the two clipboard backends arboard itself is built on, reached
# directly for one operation arboard has no API for — reading the clipboard's
# `image/png` bytes *as bytes* (`clipboard::linux`, docs/image-paste.md).
# arboard decodes them to RGBA and we would re-encode that to PNG, a round
# trip that cost tens of megabytes per paste to produce the bytes we were
# handed. Same versions arboard pins, so nothing new is compiled.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wl-clipboard-rs = "0.9"

[dev-dependencies]
# The REFERENCE tokenizer for `tokenizer`'s differential tests (tests only):
# the shipped counter is the compact in-house o200k_base store (~4 MB resident;
# docs/tokenizer.md), and every change to it is proven against tiktoken-rs's
# CoreBPE — rank-by-rank over the whole embedded vocabulary and count-by-count
# over a broad corpus — which is exactly the implementation the compact store
# replaced (its CoreBPE holds three heap copies of all ~200k tokens plus 128
# thread-local regex clones: 45.5 MB measured, the bulk of the old startup RSS).
tiktoken-rs = "0.12.0"

# Bake the project's pre-commit gate into every build so it can't silently
# regress off CI either (`.github/workflows/ci.yml` runs the same gate;
# docs/release.md). Mirrors `clippy --all-targets -- -D warnings`.
[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "deny"

# Dependencies are compiled with optimizations even in dev builds: `cargo run`
# must feel like the shipped binary where it counts — the Ctrl+V image paste
# PNG-encodes a screenshot through `image`/`png`/`fdeflate` (~65x slower
# unoptimized: ~1.6s vs ~25ms for 1080p), and ratatui repaints every frame.
# Our own crate keeps opt-level 0 for fast rebuilds and full debug info.
[profile.dev]
# Light optimization for our own crate too: dependency generics (the PNG
# encoder is generic over the writer) monomorphise INTO this crate, so at
# opt-level 0 they run unoptimised no matter how the deps were built.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `cargo build --release` — and every `cargo run --release --example …` probe
# `docs/memory.md` runs — used to recompile this ~90k-line crate from scratch
# for any edit: 53 s per one-line change measured, 44 s of it the library
# alone on one core (`docs/build-time.md`). Incremental compilation brings the
# rebuild after an edit to ~9–10 s (a bare touch, ~5 s) — unchanged codegen
# units are reused and the front end's query cache covers the rest — for a
# first build ~10% slower, a larger `target/`, and nothing measurable at
# runtime (`perf_probe`'s whole-render column stays within ±3% of the plain
# build). It applies to this crate only — cargo never compiles registry
# dependencies incrementally — so the dependency units are byte-for-byte what
# they were. A build that wants the plain layout (a packaged release, CI)
# opts out on the command line:
# `cargo build --release --config profile.release.incremental=false`.
# `lto = "off"` was measured too and rejected: 21% off a cold build, but
# 7–19% slower on the render path, since every crate loses its thin-local
# LTO and the cross-unit inlining that comes with it.
[profile.release]
incremental = true
