# LLM provider definitions (docs/llm.md).
#
# These are the providers the app ships with; this file is embedded in the
# binary. To add one of your own — any OpenAI-compatible API, or a local
# server such as llama.cpp or vLLM — don't copy this file: write the
# block in ~/.alter-zero/providers.toml, which is laid over these
# (docs/user-providers.md). A block there with a new id adds a provider, and
# one naming a provider here changes only the keys it sets.
#
# A shipped provider is a [providers.<id>] block below.
#   - `name` is the human-readable label. Every block here sets one; a block
#     in your own file that doesn't is called by its id.
#   - `api_model_base` is optional — the endpoint the /model picker lists models
#     from (its `/models` is queried). Falls back to `kwargs.api_base` when unset.
#     A path relative to the chat base (`../api/v1`) follows that base to
#     whatever host it is pointed at (LM Studio's, docs/local-models.md).
#   - Everything under `kwargs` is passed through to the client as-is, so nested
#     tables (like `venice_parameters`) round-trip fine. `kwargs.api_base` is the
#     chat-completions endpoint; other keys are forwarded in the request body.
#   - `description` (optional) is the one line saying what the provider is. A
#     subscription's says what signing in means; a pasted-key provider's is shown
#     on `/login`'s key step above the field. Either way it steers `/login`'s
#     type-to-search, so a provider is findable by what it does.
#   - `api_key_url` (optional) is where this provider's keys are created — linked
#     under the description on that same step, so a user without a key can go and
#     make one. A provider that takes no key names where the *server* comes from.
#   - `api_key_env` (optional) names the environment variable the API key is read
#     from; it defaults to `<ID_UPPERCASE>_API_KEY` (e.g. `OPENROUTER_API_KEY`).
#   - `api_base_env` (optional) names an environment variable whose value
#     replaces `kwargs.api_base` when set (Ollama's `OLLAMA_HOST`, LM Studio's
#     `LMSTUDIO_HOST`); a bare host there is completed from the base.
#   - `auth` (optional) is how the provider authenticates: a pasted key by
#     default, a subscription sign-in (`github_copilot`, `chatgpt_codex`,
#     `anthropic_console`, `cline_account`), or `optional_key` for a server
#     that needs none. It also decides the `/login` list a provider is under:
#     Use a subscription, Use an API key, or Use a local model, whose page
#     tests the server's address before saving it (docs/local-models.md).
#   - `wire_api` (optional) is the request shape: chat completions by default,
#     `responses`, `anthropic`, or `ollama` (docs/chatgpt.md, docs/claude.md,
#     docs/ollama.md).
#   - `drop_params` (optional) lists top-level request fields the provider's
#     server refuses (`prompt_cache_key`, `stream_options`, …), taken out of
#     every request after everything else is set (docs/user-providers.md).
#
# The active provider/model is chosen with `ALTER_ZERO_PROVIDER` /
# `ALTER_ZERO_MODEL`, or interactively with the `/model` picker, and persists to
# ~/.alter-zero/config.json between runs. With no API key configured — or with
# `ALTER_ZERO_DUMMY=1` — the app falls back to the built-in dummy backend, so it
# always runs offline. Add a key in-app with `/login` (saved to ~/.alter-zero/.env).
#
# Prompt caching needs no configuration here (docs/prompt-caching.md): the
# payload builder marks `cache_control` breakpoints for the models that need
# them (anthropic/…, qwen/… ids), sends a per-session `prompt_cache_key`
# (plus `session_id` on OpenRouter bases) for cache affinity, and asks every
# stream for its final usage frame (`stream_options.include_usage` — the token
# tally snaps to it). A provider whose server rejects `stream_options` or
# `prompt_cache_key` names it in `drop_params`: kwargs merge over the base
# payload, so they can change such a field, but TOML has no null to remove it.

[providers.a0_venice]
name = "Agent Zero API"
description = "Venice.ai's private, uncensored models through the Agent Zero proxy, with a free daily quota for A0T token holders."
api_key_url = "https://agent-zero.ai/p/community/api-dashboard/"
# Chat completions go through the Agent Zero proxy (kwargs.api_base below), but
# its `/models` isn't served there — the model list comes from Venice directly,
# which the `sk-a0-…` key is also valid against. So the two bases differ.
api_model_base = "https://api.venice.ai/api/v1"

[providers.a0_venice.kwargs]
api_base = "https://api.agent-zero.ai/venice/v1"

# No static `disable_thinking` here: the Shift+Tab thinking mode drives it per
# request (docs/reasoning.md). The table itself must stay — its presence is how
# the payload builder knows this is a Venice-family provider whose
# `disable_thinking` toggle must track the mode.
[providers.a0_venice.kwargs.venice_parameters]
include_venice_system_prompt = false

# Venice.ai reached **directly** (docs/venice.md) — the Agent Zero API above is
# these same models through Agent Zero's proxy, and this is the API behind it,
# unlocked by a key from your own Venice account. One wire, one request: the
# chat-completions endpoint, the `venice_parameters` table below (the
# Venice-family marker the payload builder syncs `disable_thinking` to the
# Ctrl+T mode on, docs/reasoning.md), the `prompt_cache_key` affinity hint
# Venice documents (docs/prompt-caching.md), and the `model_spec` capability
# sniffs the catalog already parses — the proxy lists from this very base. So
# only the base and the key differ, and no `api_model_base` is needed: it
# chats where it lists. The key variable is the id's default, `VENICE_API_KEY`.
[providers.venice]
name = "Venice"
description = "Venice.ai's private, uncensored models straight from Venice's own API — the same catalog the Agent Zero API proxies, reached directly with a key from your Venice account."
api_key_url = "https://venice.ai/settings/api"

[providers.venice.kwargs]
api_base = "https://api.venice.ai/api/v1"

# Venice prepends its own system prompt unless told not to; the persona is the
# whole system prompt here, exactly as through the proxy. And the table stays
# for the proxy's reason: its presence is how the payload builder knows this
# is a Venice-family provider whose `disable_thinking` must track the mode.
[providers.venice.kwargs.venice_parameters]
include_venice_system_prompt = false

# GitHub Copilot is a *subscription*, not a pasted key: `auth` puts it in
# `/login`'s subscription list, where Enter runs GitHub's device flow
# (docs/copilot.md). What `api_key_env` stores is the resulting long-lived
# GitHub OAuth token; every request exchanges it for the short-lived Copilot
# bearer the API actually takes, so nothing here is sent verbatim. The editor
# identity headers are load-bearing — Copilot answers 400 without
# `Editor-Version` and 403 without a known `Copilot-Integration-Id`.
[providers.github_copilot]
name = "GitHub Copilot"
auth = "github_copilot"
description = "Sign in with your GitHub account"
api_key_env = "GITHUB_COPILOT_TOKEN"

[providers.github_copilot.extra_headers]
Editor-Version = "vscode/1.104.3"
Editor-Plugin-Version = "copilot-chat/0.26.7"
Copilot-Integration-Id = "vscode-chat"
User-Agent = "GitHubCopilotChat/0.26.7"
Openai-Intent = "conversation-panel"

[providers.github_copilot.kwargs]
# The account's real base comes from the token exchange (`endpoints.api` —
# a Business/Enterprise seat gets its own host); this is the individual
# default and the fallback.
api_base = "https://api.githubcopilot.com"

# Ollama, the local model server, over its **native** API rather than its
# OpenAI-compatible `/v1` — hence `wire_api` (docs/ollama.md). The native wire
# is what lets a request set the context window (`options.num_ctx`), which
# `/v1` silently drops; without it every model runs at the server's default
# (4096 tokens on most machines) and the conversation is silently truncated.
# No key is needed for a local server (`auth = "optional_key"`): the provider
# is *pointed at* instead, with `OLLAMA_HOST` — Ollama's own variable, in its
# own grammar (`localhost:11434`, `0.0.0.0`, `https://host`), which `/login` →
# Use a local model writes for you once the address passes its connection
# test — and a stored `OLLAMA_HOST_API_KEY` rides as a bearer for a
# server that wants one. That key is deliberately **not** `OLLAMA_API_KEY`,
# which `ollama_cloud` below reads: two providers naming one variable share
# one credential, so a key pasted for the cloud used to mark this provider
# configured too — its ✓ in `/login`, and every `/model` open fetching from a
# local server most of those users don't run. The listing is `/api/tags` +
# `/api/show`, which is where the context window, vision, tools and thinking
# come from.
[providers.ollama]
name = "Ollama"
description = "Open models running locally on your own machine — nothing leaves it, and no key is needed. Point this at the server."
api_key_url = "https://ollama.com/download"
auth = "optional_key"
wire_api = "ollama"
api_key_env = "OLLAMA_HOST_API_KEY"
api_base_env = "OLLAMA_HOST"

[providers.ollama.kwargs]
api_base = "http://127.0.0.1:11434"

# LM Studio's local server (docs/local-models.md), reached over its
# OpenAI-compatible `/v1` the way any chat-completions provider is. Like the
# local Ollama above it needs no key (`auth = "optional_key"`) and is
# configured by being *pointed at*: `/login` → Use a local model → LM Studio
# tests the address typed and saves it to `LMSTUDIO_HOST` — a bare
# `localhost:1234` is completed from the base below, its scheme, port and
# `/v1`. A server set to "Require Authentication" takes LM Studio's own
# `LM_API_TOKEN` as a bearer, which the same page asks for when the test is
# refused. The listing is LM Studio's **native** one (`/api/v1/models`,
# LM Studio 0.4+), which carries each model's loaded context length, image
# input and type where `/v1/models` names ids alone — and `api_model_base` is
# **relative** to the chat base, so it follows the server wherever it is
# pointed. An older LM Studio without it is listed from `/v1/models`.
[providers.lmstudio]
name = "LM Studio"
description = "Open models running in LM Studio on your own machine — nothing leaves it, and no key is needed. Start its server in the Developer tab (or with `lms server start`), then point this at it."
api_key_url = "https://lmstudio.ai/download"
auth = "optional_key"
api_key_env = "LM_API_TOKEN"
api_base_env = "LMSTUDIO_HOST"
api_model_base = "../api/v1"

[providers.lmstudio.kwargs]
api_base = "http://127.0.0.1:1234/v1"

# Ollama's hosted models (ollama.com), reached directly with an API key from
# ollama.com/settings/keys — the same wire, an ordinary pasted key. It keeps
# `OLLAMA_API_KEY`, Ollama's own name for the hosted API's key, so a key
# already exported for the `ollama` CLI configures this row — and only this
# row (the server above reads `OLLAMA_HOST_API_KEY`). A local server signed
# in with `ollama signin` lists its `-cloud` models under the `ollama`
# provider above instead.
[providers.ollama_cloud]
name = "Ollama Cloud"
description = "Ollama's hosted service: the same open models, run on their datacenter GPUs instead of your machine."
api_key_url = "https://ollama.com/settings/keys"
wire_api = "ollama"
api_key_env = "OLLAMA_API_KEY"

[providers.ollama_cloud.kwargs]
api_base = "https://ollama.com"

[providers.openrouter]
name = "OpenRouter"
description = "One key for hundreds of models from every major lab — OpenAI, Anthropic, Google, Meta and more — billed from a single balance."
api_key_url = "https://openrouter.ai/workspaces/default/keys"
api_model_base = "https://openrouter.ai/api/v1"

[providers.openrouter.extra_headers]
"HTTP-Referer" = "https://github.com/linuztx/alter-zero"
"X-OpenRouter-Title" = "Alter Zero"
"X-OpenRouter-Categories" = "cli-agent"

[providers.openrouter.kwargs]
api_base = "https://openrouter.ai/api/v1"

# OpenAI's ChatGPT seat is a *subscription* too, and a second kind of sign-in:
# `/login` runs OpenAI's PKCE loopback flow in the browser — or, on a headless
# machine, Codex's own device code; Enter on the row asks which
# (docs/chatgpt.md). What `api_key_env` stores is the long-lived **refresh**
# token; every request mints a ~1h access token from it, so nothing here is
# sent verbatim. The backend speaks the **Responses** API, not chat
# completions — hence `wire_api` — and `originator` is server-side
# allowlisted: a value OpenAI does not know earns a 403.
[providers.chatgpt_codex]
name = "ChatGPT Codex"
auth = "chatgpt_codex"
wire_api = "responses"
description = "Sign in with your ChatGPT Plus/Pro account, in a browser or with a device code"
api_key_env = "CHATGPT_CODEX_REFRESH_TOKEN"

# `originator` is checked against an allow-list server-side: a value OpenAI
# does not know earns a 403 whose message does not say so. The `User-Agent`
# rides the request too, but is built at runtime (it names the OS and arch),
# so it comes from the auth seam rather than from here.
[providers.chatgpt_codex.extra_headers]
originator = "codex_cli_rs"

[providers.chatgpt_codex.kwargs]
# The ChatGPT backend, which is a different world from `api.openai.com`: it
# takes no API key, and the platform API takes no ChatGPT token.
api_base = "https://chatgpt.com/backend-api/codex"

# Anthropic's own API, reached with a **pasted key**. It speaks the Messages
# API rather than chat completions — hence `wire_api` — and the key rides
# `x-api-key` rather than `Authorization: Bearer`, which the auth seam decides
# from the pair (`docs/claude.md`). `anthropic-version` is required on every
# request; it pins the wire format, so it belongs in the file beside the base.
[providers.anthropic]
name = "Anthropic"
description = "Claude models straight from Anthropic's own API, billed per token to your API organisation. Keys start with sk-ant-."
api_key_url = "https://platform.claude.com/settings/keys"
wire_api = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[providers.anthropic.extra_headers]
anthropic-version = "2023-06-01"

[providers.anthropic.kwargs]
api_base = "https://api.anthropic.com/v1"

# The same API reached with an **Anthropic account sign-in** instead of a
# pasted key: `/login` runs Anthropic's own Console PKCE flow (docs/claude.md).
# What `api_key_env` stores is the long-lived **refresh** token; every request
# mints a short-lived access token from it, so nothing here is sent verbatim.
# The `anthropic-beta: oauth-2025-04-20` an OAuth bearer additionally needs is
# not here but in the auth seam — it is implied by the credential, not by the
# provider, and a pasted key must not send it.
#
# This is deliberately NOT a Claude Pro/Max subscription sign-in: Anthropic's
# usage policy does not permit a third-party client to offer Claude.ai login
# or route requests through subscription credentials (docs/claude.md). Usage
# here bills to the account's API organisation, exactly as a pasted key does.
[providers.anthropic_console]
name = "Anthropic Console"
auth = "anthropic_console"
wire_api = "anthropic"
description = "Sign in with your Anthropic account (billed to your API org)"
api_key_env = "ANTHROPIC_CONSOLE_REFRESH_TOKEN"

[providers.anthropic_console.extra_headers]
anthropic-version = "2023-06-01"

[providers.anthropic_console.kwargs]
api_base = "https://api.anthropic.com/v1"

# Cline's own endpoint: one OpenAI-compatible Chat Completions API in front of
# Anthropic, OpenAI, Google and the rest, reached with an API key made in your
# Cline account (app.cline.bot/dashboard/account). The chat base's own
# `/models` names ids and nothing else, so the picker lists the catalog Cline's
# clients read instead — `api_model_base` + `/models` is
# `/api/v1/ai/cline/models`, public and OpenRouter-shaped, whose records carry
# each model's context window, image input and reasoning (docs/cline.md).
[providers.cline]
name = "Cline"
api_model_base = "https://api.cline.bot/api/v1/ai/cline"
description = "The models behind the Cline extension and CLI — Anthropic, OpenAI, Google and more — reached with a key from your Cline account."
api_key_url = "https://app.cline.bot/dashboard/account"

[providers.cline.kwargs]
api_base = "https://api.cline.bot/api/v1"

# ClinePass — Cline's **subscription** plan ($9.99/month, 2-5x the usage on a
# curated set of open coding models) — on the same API, reached with a Cline
# **account sign-in** instead of a pasted key: `/login` runs Cline's own
# device-code flow (WorkOS, the way its extension and CLI sign in,
# docs/cline.md). What `api_key_env` stores is the long-lived **Cline refresh
# token** the sign-in registers; every request mints a short-lived access
# token from it, sent as `Bearer workos:<jwt>`, so nothing here is sent
# verbatim. The plan's models are addressed by their `cline-pass/…` slugs,
# which the public `/models` listing does not carry: Cline publishes the
# plan's list for its own clients, and a `cline_account` sign-in lists from
# there, so a model the plan adds is in /model the day it is listed.
# Usage-billed models bill credits rather than a plan, and are the pasted
# key's (`cline` above); free models (`cline-free/…`) are deliberately not
# here: Cline's docs say free-model usage is not supported through the API.
[providers.cline_pass]
name = "ClinePass"
auth = "cline_account"
description = "Cline's $9.99/month subscription: 2-5x usage on curated open coding models, with your Cline account sign-in"
api_key_env = "CLINE_ACCOUNT_REFRESH_TOKEN"

[providers.cline_pass.kwargs]
api_base = "https://api.cline.bot/api/v1"
