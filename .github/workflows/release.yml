# .github/workflows/release.yml — build, verify and publish a release
# (docs/release.md). Runs on a `vX.Y.Z` tag push, and by hand
# (workflow_dispatch) as a REHEARSAL: the same check, gate, builds and
# verification, the notes rendered into the job summary, and nothing
# published unless the run is on a tag and asked to. Every step is a
# scripts/release.sh command, so what the workflow does is what a developer
# can run and read. The npm job rehearses publishing the same archives as
# npm packages (docs/npm.md); npm-publish publishes them after the GitHub
# release, only when the repository opts in with the NPM_PUBLISH variable,
# and only from the `npm` environment.
name: Release

on:
  push:
    tags: ["v*"]
  # A pull request touching the release machinery runs the whole pipeline
  # as a rehearsal (the check job computes publish=false off a tag): the
  # only way the build → publish artifact handoff, or a bumped action's
  # inputs, are exercised before a release depends on them.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.sh
      - scripts/release/**
      - install.sh
      - npm/**
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish the GitHub release. Honoured only when the run is on a
          vX.Y.Z tag; off, the run is a rehearsal that builds and verifies
          every asset and renders the notes without publishing anything.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: version · changelog · tooling
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(scripts/release.sh version)" >> "$GITHUB_OUTPUT"
      - name: The tag, Cargo.toml, Cargo.lock, the README badge, npm/package.json and CHANGELOG.md agree
        # On a tag, `check` reads GITHUB_REF_TYPE/GITHUB_REF_NAME and requires
        # the tag to name Cargo.toml's version.
        run: scripts/release.sh check
      - run: shellcheck -x install.sh scripts/release.sh scripts/release/*.sh
      - run: scripts/release.sh selftest
      - id: mode
        env:
          ASKED: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$ASKED" = true ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: fmt · clippy · test · doc
    needs: check
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps --lib

  build:
    name: build ${{ matrix.target }}
    needs: [check, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 pins the glibc floor (2.35) of the Linux assets; a
          # newer image would raise it for every user who downloads one.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Cross-compiled with the distribution's arm64 gcc (oniguruma's
          # and ring's C sources need the target's compiler, not only a
          # linker); scripts/release.sh build wires cargo and `cc` to it.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          # Apple's clang cross-compiles between the two Mac CPUs, so both
          # assets build on one (arm64) runner.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the cross toolchain
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross }}
      - run: scripts/release.sh build ${{ matrix.target }}
      - run: scripts/release.sh verify dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: ${{ needs.check.outputs.publish == 'true' && 'publish' || 'rehearse publishing' }} v${{ needs.check.outputs.version }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Verify every asset together
        run: scripts/release.sh verify dist
      - name: Render the release notes from CHANGELOG.md
        run: |
          scripts/release.sh notes "$VERSION" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
      - name: Rehearse (nothing is published)
        if: needs.check.outputs.publish != 'true'
        run: scripts/release.sh publish "$VERSION" dist --notes release-notes.md --dry-run
      - name: Publish the GitHub release
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh publish "$VERSION" dist --notes release-notes.md

  # The npm packages (docs/npm.md): the same verified archives, staged as one
  # package per platform plus the launcher. Every run rehearses them — stages
  # and validates each with `npm publish --dry-run`, publishing nothing — in
  # a job that holds no credentials at all, pull requests included.
  npm:
    name: rehearse publishing v${{ needs.check.outputs.version }} to npm
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The npm that publishes, rehearsing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: scripts/release.sh npm "$VERSION" dist --dry-run

  # Publishing to npm: the one job that can, after the GitHub release it
  # mirrors and the rehearsal above. It runs only on a published tag the
  # repository has opted in to (the variable NPM_PUBLISH=true), so a release
  # cut before npm is set up stays green, and only in the `npm` environment,
  # whose protection rules decide which refs may deploy to it and which npm's
  # trusted publisher names (docs/npm.md) — an OIDC token minted anywhere
  # else is refused. A version already on npm is skipped, so the job can
  # simply be re-run.
  npm-publish:
    name: publish v${{ needs.check.outputs.version }} to npm
    needs: [check, publish, npm]
    if: needs.check.outputs.publish == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted publishing and npm's provenance statement both present the
      # job's OIDC token; nothing else here writes anywhere.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Node 24 bundles npm 11, which trusted publishing needs (11.5.1+).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the platform packages, then the launcher
        env:
          # The `npm` environment's secret, until trusted publishing
          # replaces it; empty, npm presents the OIDC token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: scripts/release.sh npm "$VERSION" dist
