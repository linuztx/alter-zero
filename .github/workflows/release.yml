# .github/workflows/release.yml — build, verify and publish a release
# (docs/release.md). Runs on a `vX.Y.Z` tag push, and by hand
# (workflow_dispatch) as a REHEARSAL: the same check, gate, builds and
# verification, the notes rendered into the job summary, and nothing
# published unless the run is on a tag and asked to. Every step is a
# scripts/release.sh command, so what the workflow does is what a developer
# can run and read. The npm job rehearses publishing the same archives as
# npm packages (docs/npm.md); npm-publish publishes them after the GitHub
# release, only when the repository opts in with the NPM_PUBLISH variable,
# and only from the `npm` environment.
name: Release

on:
  push:
    tags: ["v*"]
  # A pull request touching the release machinery runs the whole pipeline
  # as a rehearsal (the check job computes publish=false off a tag): the
  # only way the build → publish artifact handoff, or a bumped action's
  # inputs, are exercised before a release depends on them.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/windows.yml
      - .gitattributes
      - scripts/release.sh
      - scripts/release/**
      - scripts/windows/**
      - install.sh
      - install.ps1
      - npm/**
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish the GitHub release. Honoured only when the run is on a
          vX.Y.Z tag; off, the run is a rehearsal that builds and verifies
          every asset and renders the notes without publishing anything.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: version · changelog · tooling
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(scripts/release.sh version)" >> "$GITHUB_OUTPUT"
      - name: The tag, Cargo.toml, Cargo.lock, the README badge, npm/package.json and CHANGELOG.md agree
        # On a tag, `check` reads GITHUB_REF_TYPE/GITHUB_REF_NAME and requires
        # the tag to name Cargo.toml's version.
        run: scripts/release.sh check
      - run: shellcheck -x install.sh scripts/release.sh scripts/release/*.sh
      - run: scripts/release.sh selftest
      - id: mode
        env:
          ASKED: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$ASKED" = true ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: fmt · clippy · test · doc
    needs: check
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps --lib

  # Re-run native runtime coverage on the tagged/rehearsed commit, just as
  # the Linux gate above is repeated rather than trusting a prior CI result.
  windows:
    name: Windows x64 MSVC
    needs: check
    uses: ./.github/workflows/windows.yml

  build:
    name: build ${{ matrix.target }}
    needs: [check, gate, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 pins the glibc floor (2.35) of the Linux assets; a
          # newer image would raise it for every user who downloads one.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Cross-compiled with the distribution's arm64 gcc (oniguruma's
          # and ring's C sources need the target's compiler, not only a
          # linker); scripts/release.sh build wires cargo and `cc` to it.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          # Apple's clang cross-compiles between the two Mac CPUs, so both
          # assets build on one (arm64) runner.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Native MSVC, not MinGW or WSL; Windows 10 1809+ / Windows 11 x64.
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows' default is PowerShell; the release entry point is Bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - name: Require Git for Windows for the release and shell fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Join-Path $env:ProgramFiles 'Git'
          $bash = Join-Path $gitRoot 'bin\bash.exe'
          $usr = Join-Path $gitRoot 'usr\bin'
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf) -or -not (Test-Path -LiteralPath $usr -PathType Container)) {
            throw 'Git for Windows is required; do not use the WSL Bash launcher'
          }
          "ALTER_ZERO_BASH=$bash" >> $env:GITHUB_ENV
          (Join-Path $gitRoot 'bin') >> $env:GITHUB_PATH
          $usr >> $env:GITHUB_PATH
          & $bash --noprofile --norc -c 'case "$(uname -s)" in MINGW*|MSYS*) ;; *) exit 1 ;; esac'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up the x64 MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Pin native MSVC tools ahead of Git fixture utilities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          foreach ($tool in @('cl.exe', 'link.exe', 'lib.exe', 'dumpbin.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tools $tool) -PathType Leaf)) {
              throw "Missing x64 MSVC tool: $tool"
            }
          }
          # GITHUB_PATH entries outrank an exported PATH; disambiguate both
          # cargo's linker and C build tools from Git's usr/bin/link.exe.
          $tools >> $env:GITHUB_PATH
          $linker = Join-Path $tools 'link.exe'
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the cross toolchain
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross }}
      - name: Build the Unix release archive
        if: runner.os != 'Windows'
        run: bash scripts/release.sh build ${{ matrix.target }}
      - name: Build the Windows release ZIP with a static CRT
        if: runner.os == 'Windows'
        env:
          # Only this target's release build: do not change the Unix profile
          # or the debug/runtime test gate's CRT linkage policy.
          RUSTFLAGS: -C target-feature=+crt-static
        run: bash scripts/release.sh build ${{ matrix.target }}
      - run: bash scripts/release.sh verify dist
      - name: Refuse a Windows release needing the MSVC redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $imports = @(dumpbin /nologo /dependents target/x86_64-pc-windows-msvc/release/alter-zero.exe)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports
          if ($imports -match '(?i)\b(?:vcruntime\d*[^\s]*|msvcp\d*[^\s]*|msvcr\d+[^\s]*|ucrtbase[d]?|api-ms-win-crt-[^\s]+)\.dll\b') {
            throw 'Release imports a dynamic MSVC CRT; build with -C target-feature=+crt-static'
          }
      - name: Offline Windows packaged executable and installation tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test.ps1 -Dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: ${{ needs.check.outputs.publish == 'true' && 'publish' || 'rehearse publishing' }} v${{ needs.check.outputs.version }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Verify every asset together
        run: scripts/release.sh verify dist
      - name: Render the release notes from CHANGELOG.md
        run: |
          scripts/release.sh notes "$VERSION" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
      - name: Rehearse (nothing is published)
        if: needs.check.outputs.publish != 'true'
        run: scripts/release.sh publish "$VERSION" dist --notes release-notes.md --dry-run
      - name: Publish the GitHub release
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh publish "$VERSION" dist --notes release-notes.md

  # The npm packages (docs/npm.md): the same verified archives, staged as one
  # package per platform plus the launcher. Every run rehearses them — stages
  # and validates each with `npm publish --dry-run`, publishing nothing — in
  # a job that holds no credentials at all, pull requests included.
  npm:
    name: rehearse publishing v${{ needs.check.outputs.version }} to npm
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The npm that publishes, rehearsing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: scripts/release.sh npm "$VERSION" dist --dry-run

  # Publishing to npm: the one job that can, after the GitHub release it
  # mirrors and the rehearsal above. It runs only on a published tag the
  # repository has opted in to (the variable NPM_PUBLISH=true), so a release
  # cut before npm is set up stays green, and only in the `npm` environment,
  # whose protection rules decide which refs may deploy to it and which npm's
  # trusted publisher names (docs/npm.md) — an OIDC token minted anywhere
  # else is refused. A version already on npm is skipped, so the job can
  # simply be re-run.
  npm-publish:
    name: publish v${{ needs.check.outputs.version }} to npm
    needs: [check, publish, npm]
    if: needs.check.outputs.publish == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted publishing and npm's provenance statement both present the
      # job's OIDC token; nothing else here writes anywhere.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Node 24 bundles npm 11, which trusted publishing needs (11.5.1+).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the platform packages, then the launcher
        env:
          # The `npm` environment's secret, until trusted publishing
          # replaces it; empty, npm presents the OIDC token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: scripts/release.sh npm "$VERSION" dist
