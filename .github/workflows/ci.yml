# .github/workflows/ci.yml — the project's gate, on every push to main or
# feat/native-windows-support and every pull request (docs/release.md).
# Each job is one thing a contributor
# already runs before a commit, unchanged: the pre-commit gate (`cargo fmt
# --check` + `clippy -D warnings` + `test` + `doc`), the smoke suite over the
# real binary in tmux, the release tooling's own fixture tests plus the
# version/changelog agreement and the npm launcher's tests, the telemetry
# collector's pure-half tests, and the scripts the built-in web-search skill
# seeds.
# The release workflow re-runs the gate and the tooling tests before it builds
# anything, and the headless Kali container has its own workflow
# (container.yml).
name: CI

on:
  push:
    branches: [main, feat/native-windows-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A CI checkout is never rebuilt after an edit, so incremental artifacts
  # would only bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # Unconditional, blocking native coverage: no path filter or allowed failure.
  # Configure this check as required in branch protection; YAML cannot set that.
  windows:
    name: Windows x64 MSVC
    uses: ./.github/workflows/windows.yml

  gate:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        # rustup reads rust-toolchain.toml — the channel and the rustfmt and
        # clippy components — so the version lives in one file. (Older rustups
        # install it from `show`; newer ones need the explicit install.)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps --lib

  smoke:
    name: smoke suite (tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # Before the phases: the readers that decide WHICH phases a query runs are
      # pure text, and a regression in them does not fail loudly — it runs the
      # wrong selection. macOS's BSD `sed` rejected their old `{s/…/p}` form (no
      # `;` before the `}`), so `smoke_phase_title` returned nothing and every
      # query fell back to the file-name slug alone, while `121-slowstream` lost
      # the `serial` tag that keeps it out of the parallel pool. GNU sed accepts
      # both forms, so this run guards the selector; `smoke-readers-bsd` below
      # runs the same tests under BSD sed.
      - name: The phase readers and the selector
        run: bash scripts/smoke/selftest.sh
      - run: cargo build
      - name: Run every phase, one worker per core
        # The suite's default of twice the core count is sized for a
        # developer's box; on a loaded four-core machine it stretched the
        # timing-sensitive permission phases past their waits.
        id: parallel
        continue-on-error: true
        run: scripts/smoke.sh -j "$(nproc)"
      - name: Re-run the failed phases alone before calling the job red
        if: steps.parallel.outcome == 'failure'
        run: |
          cp -r target/smoke/logs target/smoke/logs-parallel
          scripts/smoke.sh --failed --serial
      - name: Keep the logs
        if: failure() || steps.parallel.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: |
            target/smoke/logs
            target/smoke/logs-parallel
          if-no-files-found: ignore
          retention-days: 7

  smoke-readers-bsd:
    # The smoke suite's phase readers and selector (scripts/smoke/selftest.sh)
    # under macOS's BSD `sed`, which refuses scripts GNU sed accepts — the
    # readers' old `{s/…/p}` form among them. The smoke job runs the same
    # tests under GNU sed, where that regression passes, so this is the run
    # that can see it. No toolchain: bash, sed and grep read fixture headers.
    name: smoke readers (BSD sed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: The phase readers and the selector, under BSD sed
        # Fail rather than pass vacuously if an image ever puts GNU sed first.
        run: |
          if sed --version >/dev/null 2>&1; then
            echo "::error::GNU sed is first on PATH; this job needs the system's BSD sed"
            exit 1
          fi
          bash -c 'echo "bash $BASH_VERSION"'
          bash scripts/smoke/selftest.sh

  clipboard-linux:
    # The Linux clipboard read against a **real** X server (docs/image-paste.md).
    # `tests/clipboard_linux.rs` is `#[ignore]`d because it needs one; Xvfb is
    # the headless server it was written against (`tests/support/x11_owner.rs`
    # plays the screenshot tool). Without this job the only coverage of the
    # streamed `image/png` read — the whole reason `clipboard/linux.rs` exists —
    # would be a developer's memory.
    name: clipboard (X11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Start a virtual X server
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          # Wait for the socket rather than sleeping: xvfb-run-less startup is
          # fast but not instant, and a raced `DISPLAY=:99` test fails obscurely.
          for _ in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
      - run: cargo test --test clipboard_linux -- --ignored --test-threads=1
        env:
          DISPLAY: ":99"

  clipboard-macos:
    # The macOS pasteboard read against the **real** pasteboard
    # (docs/image-paste.md): the 16-bit floating-point TIFF a ⌃⇧⌘4 screenshot
    # plants, the metadata AppKit's coercion would otherwise copy, and the
    # refusal a text clipboard earns. `tests/clipboard_macos.rs` fails rather
    # than skips when `CI` is set, so a pass here means every paste really ran.
    # The `clipboard::` unit tests run first: `clipboard/macos.rs`'s own are
    # macOS-only, so the Linux gate never compiles them.
    name: clipboard (macOS pasteboard)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: "cargo test --lib clipboard::"
      - run: cargo test --test clipboard_macos -- --ignored --test-threads=1

  release-tooling:
    name: release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x install.sh scripts/release.sh scripts/release/*.sh
      - run: scripts/release.sh selftest
      - name: Cargo.toml, Cargo.lock, the README badge, npm/package.json and CHANGELOG.md agree
        run: scripts/release.sh check
      - name: The npm launcher's tests
        run: node --test
        working-directory: npm

  telemetry:
    name: telemetry collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test
        working-directory: telemetry

  skill-scripts:
    # The scripts a built-in skill seeds beside its SKILL.md (docs/skills.md).
    # Offline: the providers' recorded response shapes, trimmed copies of each
    # engine's pages and a fake fetcher, so no request leaves the runner.
    name: built-in skill scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: web-search's scripts
        run: python3 -m unittest discover -s prompts/skills/web-search/scripts -p 'test_*.py' -v

  # The headless Kali container has its own workflow, container.yml: building
  # it reaches Docker Hub, a Kali mirror and github.com's release redirect, and
  # it can only be broken by docker/ itself (it installs a *published*
  # release), so it is triggered by changes to that packaging rather than on
  # every pull request.
